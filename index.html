<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null's Kudos Mod</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 280px;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #bb86fc;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #424242;
            transition: .3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #03dac6;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        #alert-box {
            display: none;
            margin-top: 12px;
            padding: 8px;
            font-size: 0.85rem;
            border-radius: 6px;
            background-color: #332940;
            color: #bb86fc;
            border: 1px solid #bb86fc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Kudos Limit (255)</h2>
        <div class="switch-container">
            <span>Stan:</span>
            <label class="switch">
                <input type="checkbox" id="toggleSwitch" onchange="sendToggle(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div id="alert-box">Przeładuj grę, aby zastosować!</div>
    </div>

    <script>
        function sendToggle(isEnabled) {
            const alertBox = document.getElementById('alert-box');
            
            fetch(`http://127.0.0.1:8888/toggle?enabled=${isEnabled}`, {
                method: 'GET',
                mode: 'cors'
            })
            .then(res => res.json())
            .then(data => {
                alertBox.innerText = "Zapisano! Przeładuj grę.";
                alertBox.style.display = "block";
            })
            .catch(err => {
                alertBox.innerText = "Błąd połączenia z aplikacją!";
                alertBox.style.display = "block";
            });
        }
    </script>
</body>
</html>
